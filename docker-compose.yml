version: '3.8'

services:
  postgres_caesar:
    image: postgres:15
    container_name: postgres_caesar
    env_file:
      - .env
    ports:
      - "22130:5432"
    volumes:
      - db_data_caesar:/var/lib/postgresql/data
    networks:
      - uts_network

  pgadmin_caesar:
    image: dpage/pgadmin4
    container_name: pgadmin_caesar
    environment:
      PGADMIN_DEFAULT_EMAIL: caesar@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "44130:80"
    depends_on:
      - postgres_caesar
    networks:
      - uts_network

networks:
  uts_network:
    driver: bridge

volumes:
  db_data_caesar: